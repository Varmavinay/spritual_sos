<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Small words. A little more light. A daily message from the Bible, the Bhagavad Gita and the Quran.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1613" media="(prefers-color-scheme: dark)">

  <!-- iOS: open full screen when added to the Home Screen (needed for Web Push on iPhone). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spiritual SOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Start connecting to Google's CDN (Flutter engine + fonts) right away. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>Spiritual SOS - Daily Wisdom</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Matches the app so there is no flash while loading. */
    html, body { margin: 0; height: 100%; background: #F6EFE6; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      font-family: "EB Garamond", Garamond, Georgia, "Times New Roman", serif;
      color: #221C18;
    }
    #loading h1 { margin: 0; font-weight: 400; font-size: 44px; line-height: 1.05; }
    #loading hr { width: 36px; border: 0; border-top: 1.6px solid #B4532F; margin: 18px auto; }
    #loading p { margin: 0; font-size: 19px; color: #7A6E64; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1B1613; }
      #loading { color: #F4EADF; }
      #loading hr { border-top-color: #E38B65; }
      #loading p { color: #B3A597; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Spiritual SOS</h1>
    <hr>
    <p>Small words. A little more light.</p>
  </div>

  <!-- History of daily messages, shared with the service worker. -->
  <script src="history_db.js"></script>
  <script>
    // Push notifications + offline support (see web/push_sw.js).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('push_sw.js').catch((e) => console.warn('SW registration failed', e));
      // Remove the worker left behind by the first version's notifications plugin.
      navigator.serviceWorker.getRegistrations().then((regs) => regs
        .filter((r) => (r.active || r.waiting || r.installing)?.scriptURL.includes('flutter_local_notifications_web'))
        .forEach((r) => r.unregister()));
    }
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
