name: divine_quotes
description: "Daily inspiring quotes from the Bible, Bhagavad Gita, and Quran."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Regenerate app icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#6750A4"
  adaptive_icon_foreground: assets/icon/icon.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#6750A4"
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#FEF7FF"
    theme_color: "#6750A4"
